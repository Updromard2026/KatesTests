<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Master">
    <meta name="theme-color" content="#667eea">
    <title>Spelling Master Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .mode-btn {
            padding: 30px;
            border: 3px solid #667eea;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
            font-family: 'Comic Sans MS', cursive;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            padding: 20px;
            border: 2px solid #764ba2;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #764ba2;
            transition: all 0.3s;
            font-family: 'Comic Sans MS', cursive;
        }

        .level-btn:hover {
            background: #764ba2;
            color: white;
            transform: scale(1.05);
        }

        .level-btn.active {
            background: #764ba2;
            color: white;
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .word-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.3em;
        }

        .word-display .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .word-display .word {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .input-area {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .spelling-input {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            border: 3px solid #667eea;
            border-radius: 15px;
            font-family: 'Comic Sans MS', cursive;
            text-align: center;
            transition: border-color 0.3s;
        }

        .spelling-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        .spelling-input.correct {
            border-color: #4caf50;
            background: #f1f8e9;
        }

        .spelling-input.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Comic Sans MS', cursive;
        }

        .btn-submit {
            background: #4caf50;
            color: white;
            grid-column: 1 / -1;
        }

        .btn-submit:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-next {
            background: #667eea;
            color: white;
        }

        .btn-next:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-restart {
            background: #ff9800;
            color: white;
        }

        .btn-restart:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        .feedback {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .feedback.correct {
            color: #4caf50;
        }

        .feedback.incorrect {
            color: #f44336;
        }

        .progress {
            background: #f0f0f0;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .progress-text {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: white;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8em;
        }

        .score-display {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 2em;
            margin: 10px 0;
        }

        .hints {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #333;
        }

        .hint-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .mode-title {
            text-align: center;
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .summary {
            text-align: center;
            font-size: 1.2em;
            color: #333;
        }

        .summary strong {
            color: #667eea;
            font-size: 1.4em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 5px;
            }

            .subtitle {
                margin-bottom: 25px;
                font-size: 1em;
            }

            .mode-selector {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .mode-btn {
                padding: 25px;
                font-size: 1.2em;
                border-radius: 15px;
                min-height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .level-selector {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .level-btn {
                padding: 18px;
                font-size: 1em;
                min-height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .word-display {
                padding: 25px;
                margin-bottom: 20px;
            }

            .word-display .word {
                font-size: 2em;
                letter-spacing: 1px;
            }

            .spelling-input {
                font-size: 16px;
                padding: 15px;
                border-radius: 12px;
            }

            .btn {
                padding: 16px 25px;
                font-size: 1em;
                border-radius: 12px;
                min-height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hints {
                padding: 12px;
                font-size: 0.9em;
                margin-bottom: 15px;
            }

            .score-display {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .progress {
                padding: 15px;
                margin-bottom: 15px;
            }

            .button-group {
                gap: 12px;
            }

            .input-label {
                font-size: 1em;
                margin-bottom: 8px;
            }

            .mode-title {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            body {
                padding: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 3px;
            }

            .subtitle {
                margin-bottom: 20px;
                font-size: 0.95em;
            }

            .word-display .word {
                font-size: 1.6em;
            }

            .word-display .label {
                font-size: 0.85em;
            }

            .score-display {
                font-size: 1.1em;
            }

            .spelling-input {
                font-size: 16px;
            }

            .btn {
                font-size: 0.95em;
                padding: 14px 20px;
            }

            .mode-btn {
                padding: 20px;
                font-size: 1.1em;
            }

            .level-btn {
                padding: 16px;
                font-size: 0.9em;
            }

            .emoji {
                font-size: 1.5em;
            }

            .summary {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Spelling Master ✨</h1>
        <p class="subtitle">Master these tricky words!</p>

        <!-- Mode Selection -->
        <div id="modeSelection">
            <div class="mode-selector">
                <button class="mode-btn" onclick="startMode('quiz')">📝 Quiz Mode</button>
                <button class="mode-btn" onclick="startMode('practice')">🎮 Practice Mode</button>
            </div>
        </div>

        <!-- Level Selection -->
        <div id="levelSelection" style="display: none;">
            <p style="text-align: center; font-weight: bold; color: #667eea; margin-bottom: 20px;">Choose Your Level:</p>
            <div class="level-selector">
                <button class="level-btn" onclick="selectLevel(1)">🌱 Easy</button>
                <button class="level-btn" onclick="selectLevel(2)">🌿 Medium</button>
                <button class="level-btn" onclick="selectLevel(3)">🌳 Hard</button>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea">
            <div class="mode-title" id="modeTitle"></div>

            <div class="progress">
                <div class="progress-text" id="progressText">Word 1 of 4</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="score-display" id="scoreDisplay">Score: 0/0</div>

            <div class="word-display">
                <div class="label" id="wordLabel">Listen or read:</div>
                <div class="word" id="wordDisplay">WORD</div>
            </div>

            <div id="hintsContainer"></div>

            <div class="input-area">
                <label class="input-label">Type the spelling:</label>
                <input type="text" class="spelling-input" id="spellingInput" placeholder="Type here..." autocomplete="off">
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="button-group">
                <button class="btn btn-submit" onclick="checkAnswer()">Check Answer ✓</button>
            </div>

            <div class="button-group" id="nextButtonGroup" style="display: none;">
                <button class="btn btn-next" onclick="nextWord()">Next Word →</button>
                <button class="btn btn-restart" onclick="reset()">Start Over 🔄</button>
            </div>
        </div>

        <!-- Results -->
        <div id="resultsArea" style="display: none;">
            <div class="score-display" id="finalScore"></div>
            <div class="emoji" id="resultEmoji"></div>
            <div class="summary" id="resultSummary"></div>
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn btn-restart" onclick="reset()">Play Again 🎮</button>
            </div>
        </div>
    </div>

    <script>
        const words = [
            {
                word: 'Knuckle',
                hint: 'The part of your finger where it bends.',
                example: 'She rapped her knuckles on the door.',
                definition: 'A joint in your finger'
            },
            {
                word: 'Knit',
                hint: 'Making something with yarn and needles.',
                example: 'She likes to knit sweaters.',
                definition: 'To make fabric from yarn'
            },
            {
                word: 'Knee',
                hint: 'The joint in your leg where you can bend.',
                example: 'He fell on his knee while playing.',
                definition: 'The joint between thigh and shin'
            },
            {
                word: 'Rhyme',
                hint: 'Words that sound the same at the end.',
                example: '"Cat" and "bat" rhyme with each other.',
                definition: 'Words with matching sounds'
            }
        ];

        let currentMode = null;
        let currentLevel = null;
        let currentWordIndex = 0;
        let score = 0;
        let answered = false;
        let correctAnswer = false;

        function startMode(mode) {
            currentMode = mode;
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('levelSelection').style.display = 'block';
            document.getElementById('modeTitle').textContent =
                mode === 'quiz' ? '📝 Quiz Mode' : '🎮 Practice Mode';
        }

        function selectLevel(level) {
            currentLevel = level;
            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            currentWordIndex = 0;
            score = 0;
            answered = false;
            loadWord();
        }

        function loadWord() {
            const wordObj = words[currentWordIndex];
            document.getElementById('wordDisplay').textContent = wordObj.word.toUpperCase();
            document.getElementById('progressText').textContent =
                `Word ${currentWordIndex + 1} of ${words.length}`;
            document.getElementById('progressFill').style.width =
                `${((currentWordIndex + 1) / words.length) * 100}%`;
            document.getElementById('scoreDisplay').textContent =
                `Score: ${score}/${currentWordIndex}`;
            document.getElementById('spellingInput').value = '';
            document.getElementById('spellingInput').className = 'spelling-input';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextButtonGroup').style.display = 'none';
            answered = false;
            correctAnswer = false;

            // Show hints based on level
            const hintsContainer = document.getElementById('hintsContainer');
            hintsContainer.innerHTML = '';

            if (currentLevel >= 1) {
                hintsContainer.innerHTML += `
                    <div class="hints">
                        <div class="hint-title">💡 Definition:</div>
                        ${wordObj.definition}
                    </div>
                `;
            }

            if (currentLevel >= 2) {
                hintsContainer.innerHTML += `
                    <div class="hints">
                        <div class="hint-title">📖 Example:</div>
                        ${wordObj.example}
                    </div>
                `;
            }

            document.getElementById('spellingInput').focus();
        }

        function checkAnswer() {
            if (answered) return;

            const input = document.getElementById('spellingInput');
            const userAnswer = input.value.trim().toLowerCase();
            const correctWord = words[currentWordIndex].word.toLowerCase();

            answered = true;

            if (userAnswer === correctWord) {
                correctAnswer = true;
                score++;
                document.getElementById('feedback').textContent = '🎉 Perfect! Great job!';
                document.getElementById('feedback').className = 'feedback correct';
                input.className = 'spelling-input correct';
            } else {
                document.getElementById('feedback').textContent =
                    `❌ Not quite. It's spelled: ${words[currentWordIndex].word}`;
                document.getElementById('feedback').className = 'feedback incorrect';
                input.className = 'spelling-input incorrect';
            }

            document.getElementById('scoreDisplay').textContent =
                `Score: ${score}/${currentWordIndex + 1}`;

            if (currentWordIndex < words.length - 1) {
                document.getElementById('nextButtonGroup').style.display = 'grid';
            } else {
                setTimeout(showResults, 1500);
            }
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex < words.length) {
                loadWord();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';

            const percentage = Math.round((score / words.length) * 100);
            document.getElementById('finalScore').textContent =
                `${score} out of ${words.length}!`;

            let emoji = '😊';
            let message = '';

            if (percentage === 100) {
                emoji = '🏆';
                message = 'Perfect! You\'re a spelling champion! 👑';
            } else if (percentage >= 75) {
                emoji = '🌟';
                message = 'Excellent work! You\'re a spelling star! ⭐';
            } else if (percentage >= 50) {
                emoji = '🎯';
                message = 'Good job! Keep practicing to get even better! 💪';
            } else {
                emoji = '💪';
                message = 'Great effort! Practice makes perfect! Keep going! 🚀';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultSummary').textContent = message;
        }

        function reset() {
            currentMode = null;
            currentLevel = null;
            currentWordIndex = 0;
            score = 0;
            answered = false;
            correctAnswer = false;

            document.getElementById('modeSelection').style.display = 'block';
            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'none';
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('gameArea').style.display === 'block') {
                if (!answered) {
                    checkAnswer();
                } else if (currentWordIndex < words.length - 1) {
                    nextWord();
                }
            }
        });

        // Mobile optimization: handle keyboard visibility
        let originalHeight = window.innerHeight;
        window.addEventListener('resize', function() {
            let currentHeight = window.innerHeight;
            if (currentHeight < originalHeight * 0.75) {
                document.body.style.overflow = 'auto';
            } else {
                document.body.style.overflow = 'hidden';
            }
        });

        // Prevent zoom on input focus (iOS)
        document.addEventListener('touchstart', function() {
            document.body.style.zoom = 1;
        });
    </script>
</body>
</html>
