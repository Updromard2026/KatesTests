<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kates Bubble Test">
    <meta name="theme-color" content="#667eea">
    <title>Kates Bubble Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-height: 95vh;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 18px;
            border: 3px solid #667eea;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .level-btn {
            padding: 14px 10px;
            border: 2px solid #764ba2;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #764ba2;
            transition: all 0.3s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .level-btn:hover {
            background: #764ba2;
            color: white;
            transform: scale(1.05);
        }

        .level-btn.active {
            background: #764ba2;
            color: white;
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .word-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .word-display .label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .word-display .word {
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .audio-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        .stats-bar {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            text-align: center;
            font-size: 0.9em;
        }

        .stat-item {
            background: white;
            padding: 6px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.75em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #764ba2;
        }

        .input-area {
            margin-bottom: 12px;
        }

        .input-label {
            display: block;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .spelling-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 3px solid #667eea;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            text-align: center;
            transition: border-color 0.3s;
        }

        .spelling-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        .spelling-input.correct {
            border-color: #4caf50;
            background: #f1f8e9;
        }

        .spelling-input.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 0.95em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .btn-submit {
            background: #4caf50;
            color: white;
            grid-column: 1 / -1;
        }

        .btn-submit:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-next {
            background: #667eea;
            color: white;
        }

        .btn-next:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-restart {
            background: #ff9800;
            color: white;
        }

        .btn-restart:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        .feedback {
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 12px;
            min-height: 25px;
        }

        .feedback.correct {
            color: #4caf50;
        }

        .feedback.incorrect {
            color: #f44336;
        }

        .progress {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
        }

        .progress-text {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .progress-bar {
            background: white;
            border-radius: 8px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.7em;
        }

        .score-display {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 12px;
        }

        .emoji {
            font-size: 1.5em;
            margin: 8px 0;
        }

        .hints {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.85em;
            color: #333;
        }

        .hint-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 3px;
            font-size: 0.85em;
        }

        .mode-title {
            text-align: center;
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .summary {
            text-align: center;
            font-size: 1em;
            color: #333;
        }

        .summary strong {
            color: #667eea;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 5px;
            }

            .subtitle {
                margin-bottom: 25px;
                font-size: 1em;
            }

            .stats-bar {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
                padding: 12px;
                margin-bottom: 15px;
            }

            .stat-item {
                padding: 8px;
            }

            .stat-label {
                font-size: 0.8em;
            }

            .stat-value {
                font-size: 1.1em;
            }

            .audio-btn {
                width: 50px;
                height: 50px;
                font-size: 1.5em;
            }

            .mode-selector {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .mode-btn {
                padding: 25px;
                font-size: 1.2em;
                border-radius: 15px;
                min-height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .level-selector {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .level-btn {
                padding: 18px;
                font-size: 1em;
                min-height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .word-display {
                padding: 25px;
                margin-bottom: 20px;
            }

            .word-display .word {
                font-size: 2em;
                letter-spacing: 1px;
            }

            .spelling-input {
                font-size: 16px;
                padding: 15px;
                border-radius: 12px;
            }

            .btn {
                padding: 16px 25px;
                font-size: 1em;
                border-radius: 12px;
                min-height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hints {
                padding: 12px;
                font-size: 0.9em;
                margin-bottom: 15px;
            }

            .score-display {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .progress {
                padding: 15px;
                margin-bottom: 15px;
            }

            .button-group {
                gap: 12px;
            }

            .input-label {
                font-size: 1em;
                margin-bottom: 8px;
            }

            .mode-title {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            body {
                padding: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 3px;
            }

            .subtitle {
                margin-bottom: 20px;
                font-size: 0.95em;
            }

            .word-display .word {
                font-size: 1.6em;
            }

            .word-display .label {
                font-size: 0.85em;
            }

            .score-display {
                font-size: 1.1em;
            }

            .spelling-input {
                font-size: 16px;
            }

            .btn {
                font-size: 0.95em;
                padding: 14px 20px;
            }

            .mode-btn {
                padding: 20px;
                font-size: 1.1em;
            }

            .level-btn {
                padding: 16px;
                font-size: 0.9em;
            }

            .emoji {
                font-size: 1.5em;
            }

            .summary {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Kates Bubble Test ✨</h1>

        <!-- Name Entry -->
        <div id="nameEntry">
            <p style="text-align: center; font-weight: bold; color: #667eea; margin-bottom: 20px; font-size: 1.1em;">What's your name?</p>
            <input type="text" id="nameInput" placeholder="Enter your name..." style="width: 100%; padding: 15px; font-size: 1.1em; border: 3px solid #667eea; border-radius: 15px; text-align: center; margin-bottom: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;">
            <button class="btn btn-submit" onclick="startWithName()" style="width: 100%;">Let's Go! 🚀</button>
            <div style="margin-top: 30px; padding: 20px; background: #f0f0f0; border-radius: 15px;">
                <p style="text-align: center; font-weight: bold; color: #667eea; margin-bottom: 15px;">🏆 Top Scorers</p>
                <div id="leaderboard" style="font-size: 0.95em;"></div>
            </div>
        </div>

        <!-- Language Selection -->
        <div id="languageSelection" style="display: none;">
            <p style="text-align: center; font-weight: bold; color: #667eea; margin-bottom: 20px;">Choose Language:</p>
            <div class="mode-selector">
                <button class="mode-btn" onclick="selectLanguage('english')">🇬🇧 English Words</button>
                <button class="mode-btn" onclick="selectLanguage('irish')">🇮🇪 Irish Words</button>
            </div>
        </div>

        <!-- Mode Selection -->
        <div id="modeSelection" style="display: none;">
            <div class="mode-selector">
                <button class="mode-btn" onclick="startMode('practice')" style="grid-column: 1 / -1;">🎮 Practice Mode</button>
            </div>
        </div>

        <!-- Level Selection -->
        <div id="levelSelection" style="display: none;">
            <p style="text-align: center; font-weight: bold; color: #667eea; margin-bottom: 20px;">Choose Your Level:</p>
            <div class="level-selector">
                <button class="level-btn" onclick="selectLevel(1)">🌱 Easy</button>
                <button class="level-btn" onclick="selectLevel(2)">🌿 Medium</button>
                <button class="level-btn" onclick="selectLevel(3)">🌳 Hard</button>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea">
            <div class="mode-title" id="modeTitle"></div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-label">Streak</div>
                    <div class="stat-value" id="streakDisplay">0 days</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracyDisplay">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Plays</div>
                    <div class="stat-value" id="totalPlaysDisplay">0</div>
                </div>
            </div>

            <div class="progress">
                <div class="progress-text" id="progressText">Word 1 of 4</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="score-display" id="scoreDisplay">Score: 0/0</div>

            <div class="word-display">
                <div class="label" id="wordLabel">Listen or read: (fades in 10s, gone in 20s)</div>
                <div class="word" id="wordDisplay" onclick="revealWord()">
                    <button class="audio-btn" onclick="speakWord(event)" title="Click to hear pronunciation">🔊</button>
                    <span id="wordText">WORD</span>
                </div>
            </div>

            <div id="hintsContainer"></div>

            <div class="input-area">
                <label class="input-label">Type the spelling:</label>
                <input type="text" class="spelling-input" id="spellingInput" placeholder="Type here..." autocomplete="off">
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="button-group">
                <button class="btn btn-submit" onclick="checkAnswer()">Check Answer ✓</button>
            </div>

            <div class="button-group" id="nextButtonGroup" style="display: none;">
                <button class="btn btn-next" onclick="nextWord()">Next Word →</button>
                <button class="btn btn-restart" onclick="reset()">Start Over 🔄</button>
            </div>
        </div>

        <!-- Results -->
        <div id="resultsArea" style="display: none;">
            <div class="score-display" id="finalScore"></div>
            <div class="emoji" id="resultEmoji"></div>
            <div class="summary" id="resultSummary"></div>
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn btn-restart" onclick="reset()">Play Again 🎮</button>
            </div>
        </div>
    </div>

    <script>
        const englishWords = [
            {
                word: 'Knuckle',
                hint: 'The part of your finger where it bends.',
                example: 'She rapped her knuckles on the door.',
                definition: 'A joint in your finger'
            },
            {
                word: 'Knit',
                hint: 'Making something with yarn and needles.',
                example: 'She likes to knit sweaters.',
                definition: 'To make fabric from yarn'
            },
            {
                word: 'Knee',
                hint: 'The joint in your leg where you can bend.',
                example: 'He fell on his knee while playing.',
                definition: 'The joint between thigh and shin'
            },
            {
                word: 'Rhyme',
                hint: 'Words that sound the same at the end.',
                example: '"Cat" and "bat" rhyme with each other.',
                definition: 'Words with matching sounds'
            }
        ];

        const irishWords = [
            {
                word: 'Banana',
                hint: 'A yellow tropical fruit.',
                example: 'Ba bhreá liom banana a ithe.',
                definition: 'A curved yellow fruit'
            },
            {
                word: 'Cairéid',
                hint: 'An orange vegetable that grows underground.',
                example: 'Thaitin an chairéid liom sa bhricfeasta.',
                definition: 'A carrot'
            }
        ];

        function getWords() {
            return currentLanguage === 'english' ? englishWords : irishWords;
        }

        let currentMode = null;
        let currentLevel = null;
        let currentWordIndex = 0;
        let score = 0;
        let answered = false;
        let correctAnswer = false;
        let wordTimer = null;
        let currentLanguage = 'english'; // 'english' or 'irish'
        let currentName = ''; // Child's name
        let allStats = {}; // All children's stats

        // Initialize stats on load
        function initStats() {
            const saved = localStorage.getItem('spellingStats');
            if (saved) {
                allStats = JSON.parse(saved);
            }
        }

        function getChildStats() {
            if (!allStats[currentName]) {
                allStats[currentName] = {
                    english: {
                        totalAttempts: 0,
                        correctAnswers: 0,
                        lastPlayed: null,
                        streak: 0,
                        wordStats: {}
                    },
                    irish: {
                        totalAttempts: 0,
                        correctAnswers: 0,
                        lastPlayed: null,
                        streak: 0,
                        wordStats: {}
                    }
                };
            }
            return allStats[currentName];
        }

        function saveStats() {
            localStorage.setItem('spellingStats', JSON.stringify(allStats));
        }

        function updateStreak() {
            const childStats = getChildStats();
            const langStats = childStats[currentLanguage];
            const today = new Date().toDateString();
            const lastDate = langStats.lastPlayed ? new Date(langStats.lastPlayed).toDateString() : null;

            if (lastDate === today) {
                // Already played today
                return;
            }

            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);

            if (lastDate === yesterday.toDateString()) {
                // Played yesterday, continue streak
                langStats.streak++;
            } else {
                // Start new streak
                langStats.streak = 1;
            }

            langStats.lastPlayed = new Date().toISOString();
            saveStats();
        }

        function updateStatsDisplay() {
            const childStats = getChildStats();
            const langStats = childStats[currentLanguage];
            const accuracy = langStats.totalAttempts > 0
                ? Math.round((langStats.correctAnswers / langStats.totalAttempts) * 100)
                : 0;
            document.getElementById('streakDisplay').textContent = langStats.streak + ' day' + (langStats.streak !== 1 ? 's' : '');
            document.getElementById('accuracyDisplay').textContent = accuracy + '%';
            document.getElementById('totalPlaysDisplay').textContent = langStats.totalAttempts;
        }

        function speakWord(event) {
            event.stopPropagation();
            const words = getWords();
            const wordText = words[currentWordIndex].word;
            const utterance = new SpeechSynthesisUtterance(wordText);
            utterance.rate = 0.8;
            utterance.pitch = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function updateLeaderboard() {
            const leaderboardDiv = document.getElementById('leaderboard');
            const scores = [];

            // Collect all scores
            for (const name in allStats) {
                const englishStats = allStats[name].english;
                const irishStats = allStats[name].irish;

                if (englishStats.totalAttempts > 0) {
                    const accuracy = Math.round((englishStats.correctAnswers / englishStats.totalAttempts) * 100);
                    scores.push({ name, language: 'English', accuracy });
                }
                if (irishStats.totalAttempts > 0) {
                    const accuracy = Math.round((irishStats.correctAnswers / irishStats.totalAttempts) * 100);
                    scores.push({ name, language: 'Irish', accuracy });
                }
            }

            // Sort by accuracy descending
            scores.sort((a, b) => b.accuracy - a.accuracy);

            // Display top 5
            if (scores.length === 0) {
                leaderboardDiv.innerHTML = '<p style="text-align: center; color: #999;">No scores yet. Be the first!</p>';
            } else {
                let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
                scores.slice(0, 5).forEach((score, index) => {
                    const medal = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'][index];
                    html += `<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: white; border-radius: 8px;">
                        <span>${medal} <strong>${score.name}</strong> (${score.language})</span>
                        <span style="color: #667eea; font-weight: bold;">${score.accuracy}%</span>
                    </div>`;
                });
                html += '</div>';
                leaderboardDiv.innerHTML = html;
            }
        }

        function startWithName() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();

            if (!name) {
                alert('Please enter your name!');
                return;
            }

            currentName = name;
            getChildStats(); // Initialize stats for this child

            document.getElementById('nameEntry').style.display = 'none';
            document.getElementById('languageSelection').style.display = 'block';
            updateStatsDisplay();
        }

        function selectLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('languageSelection').style.display = 'none';
            document.getElementById('modeSelection').style.display = 'block';
            updateStatsDisplay();
        }

        function startMode(mode) {
            currentMode = mode;
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('levelSelection').style.display = 'block';
            document.getElementById('modeTitle').textContent = '🎮 Practice Mode';
        }

        function selectLevel(level) {
            currentLevel = level;
            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            currentWordIndex = 0;
            score = 0;
            answered = false;
            updateStreak();
            loadWord();
        }

        function loadWord() {
            const words = getWords();
            const wordObj = words[currentWordIndex];
            const wordText = document.getElementById('wordText');
            wordText.textContent = wordObj.word.toUpperCase();
            const wordDisplay = document.getElementById('wordDisplay');
            wordDisplay.style.opacity = '1';
            wordDisplay.style.visibility = 'visible';

            updateStatsDisplay();

            document.getElementById('progressText').textContent =
                `Word ${currentWordIndex + 1} of ${words.length}`;
            document.getElementById('progressFill').style.width =
                `${((currentWordIndex + 1) / words.length) * 100}%`;
            document.getElementById('scoreDisplay').textContent =
                `Score: ${score}/${currentWordIndex}`;
            document.getElementById('spellingInput').value = '';
            document.getElementById('spellingInput').className = 'spelling-input';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextButtonGroup').style.display = 'none';
            answered = false;
            correctAnswer = false;

            // Show hints based on level
            const hintsContainer = document.getElementById('hintsContainer');
            hintsContainer.innerHTML = '';

            if (currentLevel >= 1) {
                hintsContainer.innerHTML += `
                    <div class="hints">
                        <div class="hint-title">💡 Definition:</div>
                        ${wordObj.definition}
                    </div>
                `;
            }

            if (currentLevel >= 2) {
                hintsContainer.innerHTML += `
                    <div class="hints">
                        <div class="hint-title">📖 Example:</div>
                        ${wordObj.example}
                    </div>
                `;
            }

            // Clear previous timers
            if (wordTimer) {
                wordTimer.forEach(timer => clearTimeout(timer));
            }

            // Fade to 15% after 10 seconds
            let timer1 = setTimeout(() => {
                wordDisplay.style.opacity = '0.15';
                wordDisplay.style.cursor = 'pointer';
                wordDisplay.title = 'Click to show word again';
            }, 10000);

            // Disappear completely after another 10 seconds (20 total)
            let timer2 = setTimeout(() => {
                wordDisplay.style.opacity = '0';
                wordDisplay.style.visibility = 'hidden';
            }, 20000);

            wordTimer = [timer1, timer2];

            document.getElementById('spellingInput').focus();
        }

        function revealWord() {
            const wordDisplay = document.getElementById('wordDisplay');
            wordDisplay.style.opacity = '1';
            wordDisplay.style.visibility = 'visible';
            wordDisplay.style.cursor = 'default';
            wordDisplay.title = '';

            // Reset both timers
            if (wordTimer) {
                wordTimer.forEach(timer => clearTimeout(timer));
            }

            let timer1 = setTimeout(() => {
                wordDisplay.style.opacity = '0.15';
                wordDisplay.style.cursor = 'pointer';
                wordDisplay.title = 'Click to show word again';
            }, 10000);

            let timer2 = setTimeout(() => {
                wordDisplay.style.opacity = '0';
                wordDisplay.style.visibility = 'hidden';
            }, 20000);

            wordTimer = [timer1, timer2];
        }

        function updateWordStats(isCorrect) {
            const words = getWords();
            const word = words[currentWordIndex].word;
            const childStats = getChildStats();
            const langStats = childStats[currentLanguage];
            if (!langStats.wordStats[word]) {
                langStats.wordStats[word] = { correct: 0, attempts: 0 };
            }
            langStats.wordStats[word].attempts++;
            if (isCorrect) {
                langStats.wordStats[word].correct++;
            }
            langStats.totalAttempts++;
            if (isCorrect) {
                langStats.correctAnswers++;
            }
            saveStats();
        }

        function checkAnswer() {
            console.log('checkAnswer() called, answered:', answered);
            if (answered) return;

            const input = document.getElementById('spellingInput');
            const userAnswer = input.value.trim().toLowerCase();
            console.log('User answer:', userAnswer);
            const currentWords = getWords();
            const correctWord = currentWords[currentWordIndex].word.toLowerCase();

            answered = true;

            if (userAnswer === correctWord) {
                correctAnswer = true;
                score++;
                updateWordStats(true);
                document.getElementById('feedback').textContent = '🎉 Perfect! Great job!';
                document.getElementById('feedback').className = 'feedback correct';
                input.className = 'spelling-input correct';
            } else {
                updateWordStats(false);
                document.getElementById('feedback').textContent =
                    `❌ Not quite. It's spelled: ${currentWords[currentWordIndex].word}`;
                document.getElementById('feedback').className = 'feedback incorrect';
                input.className = 'spelling-input incorrect';
            }

            document.getElementById('scoreDisplay').textContent =
                `Score: ${score}/${currentWordIndex + 1}`;
            updateStatsDisplay();

            if (currentWordIndex < currentWords.length - 1) {
                console.log('Showing nextButtonGroup, currentWordIndex:', currentWordIndex, 'length:', currentWords.length);
                document.getElementById('nextButtonGroup').style.display = 'grid';
            } else {
                console.log('Last word, showing results in 1500ms');
                setTimeout(showResults, 1500);
            }
        }

        function nextWord() {
            console.log('nextWord() called, currentWordIndex:', currentWordIndex);
            currentWordIndex++;
            console.log('New currentWordIndex:', currentWordIndex, 'Total words:', getWords().length);
            if (currentWordIndex < getWords().length) {
                loadWord();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';

            const currentWords = getWords();
            const percentage = Math.round((score / currentWords.length) * 100);
            document.getElementById('finalScore').textContent =
                `${score} out of ${currentWords.length}!`;

            let emoji = '😊';
            let message = '';

            if (percentage === 100) {
                emoji = '🏆';
                message = 'Perfect! You\'re a spelling champion! 👑';
            } else if (percentage >= 75) {
                emoji = '🌟';
                message = 'Excellent work! You\'re a spelling star! ⭐';
            } else if (percentage >= 50) {
                emoji = '🎯';
                message = 'Good job! Keep practicing to get even better! 💪';
            } else {
                emoji = '💪';
                message = 'Great effort! Practice makes perfect! Keep going! 🚀';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultSummary').textContent = message;
        }

        function reset() {
            currentMode = null;
            currentLevel = null;
            currentWordIndex = 0;
            score = 0;
            answered = false;
            correctAnswer = false;
            currentName = '';
            if (wordTimer) {
                wordTimer.forEach(timer => clearTimeout(timer));
            }

            document.getElementById('nameEntry').style.display = 'block';
            document.getElementById('languageSelection').style.display = 'none';
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('levelSelection').style.display = 'none';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('nameInput').value = '';
            updateLeaderboard();
        }

        // Initialize on page load
        window.addEventListener('load', function() {
            initStats();
            updateLeaderboard();
        });

        // Allow Enter key on name input
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('nameEntry').style.display !== 'none') {
                startWithName();
            }
        });

        // Allow Enter key to submit
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('gameArea').style.display === 'block') {
                if (!answered) {
                    checkAnswer();
                } else if (currentWordIndex < getWords().length - 1) {
                    nextWord();
                }
            }
        });

        // Mobile optimization: handle keyboard visibility
        let originalHeight = window.innerHeight;
        window.addEventListener('resize', function() {
            let currentHeight = window.innerHeight;
            if (currentHeight < originalHeight * 0.75) {
                document.body.style.overflow = 'auto';
            } else {
                document.body.style.overflow = 'hidden';
            }
        });

        // Prevent zoom on input focus (iOS)
        document.addEventListener('touchstart', function() {
            document.body.style.zoom = 1;
        });
    </script>
</body>
</html>
